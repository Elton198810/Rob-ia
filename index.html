
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rob-ia V2</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
header{padding:18px;background:#111827;text-align:center}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#182235;border-radius:14px;padding:18px;margin:14px 0}
.drop{border:2px dashed #4f86ff;padding:30px;text-align:center;border-radius:12px}
button{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
img{max-width:100%;display:none;border-radius:10px;margin-top:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.small{background:#0f172a;padding:12px;border-radius:10px}
#res{display:none}
</style></head><body>
<header><h1>🤖 Rob-ia V2</h1><p>Interface pronta para futura IA de visão</p></header>
<div class="wrap">
<div class="card">
<div class="drop">
<input id="file" type="file" accept="image/*">
<img id="preview">
</div><br>
<button onclick="analisar()">Analisar com IA</button>
</div>

<div id="res" class="card">
<h2>Resultado</h2>
<div class="grid">
<div class="small"><b>Sinal</b><br>AGUARDAR</div>
<div class="small"><b>Confiança</b><br>--%</div>
<div class="small"><b>Tendência</b><br>Aguardando IA</div>
<div class="small"><b>EMA</b><br>--</div>
<div class="small"><b>Suporte</b><br>--</div>
<div class="small"><b>Resistência</b><br>--</div>
</div>
<p style="margin-top:16px">Esta V2 entrega a interface. A interpretação automática do gráfico será adicionada quando uma IA de visão for integrada.</p>
</div>
</div>
<script>
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=x=>{preview.src=x.target.result;preview.style.display='block';};
 r.readAsDataURL(f);
}
function analisar(){document.getElementById('res').style.display='block';}
</script>
</body></html>
