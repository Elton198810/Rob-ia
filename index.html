<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caçador IA</title><style>body{background:#0f172a;color:#fff;font-family:Arial;margin:0}header{background:#111827;padding:20px;text-align:center}.c{max-width:800px;margin:auto;padding:20px}.card{background:#1e293b;padding:20px;border-radius:12px}button{padding:10px 16px;background:#22c55e;color:#fff;border:0;border-radius:8px}img{max-width:100%;display:none;margin-top:10px}#r{display:none;margin-top:15px;background:#0b1220;padding:12px;border-radius:8px}</style></head><body><header><h1>Caçador IA</h1></header><div class="c"><div class="card"><input id="f" type="file" accept="image/*"><br><br><img id="p"><br><button onclick="a()">Analisar</button><div id="r"><h3>Resultado</h3><p><b>Sinal:</b> AGUARDAR</p><p><b>Confiança:</b> --%</p><p>Interface pronta. A análise por IA será integrada posteriormente.</p></div></div></div><script>f.onchange=e=>{let file=e.target.files[0];if(!file)return;let fr=new FileReader();fr.onload=x=>{p.src=x.target.result;p.style.display="block"};fr.readAsDataURL(file)};function a(){r.style.display="block";}</script></body></html>
