
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rob-ia V3</title>
<style>
body{margin:0;background:#08111f;color:#fff;font-family:Arial}
header{background:#101a2d;padding:18px;text-align:center}
.container{max-width:950px;margin:auto;padding:18px}
.card{background:#16233b;border-radius:14px;padding:16px;margin:16px 0}
input,button{padding:12px;border-radius:8px;border:none}
input{width:100%;box-sizing:border-box;margin:8px 0}
button{background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.box{background:#0f172a;padding:12px;border-radius:10px}
#app{display:none}
img{max-width:100%;display:none;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<header><h1>🤖 Rob-ia V3</h1><p>Painel com login e histórico local</p></header>

<div class="container">
<div id="login" class="card">
<h2>Entrar</h2>
<input id="nome" placeholder="Seu nome">
<button onclick="entrar()">Acessar</button>
</div>

<div id="app">
<div class="card">
<h2 id="boas"></h2>
<input type="file" id="arq" accept="image/*">
<img id="prev">
<br><br>
<button onclick="analisar()">Analisar com IA</button>
</div>

<div class="card">
<div class="grid">
<div class="box"><b>Sinal</b><br><span id="sinal">AGUARDAR</span></div>
<div class="box"><b>Confiança</b><br>--%</div>
<div class="box"><b>Histórico</b><br><span id="total">0</span> análises</div>
</div>
</div>

<div class="card">
<h3>Últimas análises</h3>
<ul id="hist"></ul>
</div>
</div>
</div>

<script>
function entrar(){
 let n=nome.value.trim()||"Operador";
 localStorage.setItem("robia_nome",n);
 login.style.display="none";
 app.style.display="block";
 boas.innerText="Bem-vindo, "+n;
 carregar();
}
if(localStorage.getItem("robia_nome")){
 nome.value=localStorage.getItem("robia_nome");
 entrar();
}
arq.onchange=e=>{
 let f=e.target.files[0];
 if(!f)return;
 let r=new FileReader();
 r.onload=x=>{prev.src=x.target.result;prev.style.display="block";}
 r.readAsDataURL(f);
}
function analisar(){
 let h=JSON.parse(localStorage.getItem("robia_hist")||"[]");
 h.unshift(new Date().toLocaleString()+" - Análise iniciada");
 localStorage.setItem("robia_hist",JSON.stringify(h));
 carregar();
}
function carregar(){
 let h=JSON.parse(localStorage.getItem("robia_hist")||"[]");
 total.innerText=h.length;
 hist.innerHTML="";
 h.slice(0,10).forEach(v=>{
  let li=document.createElement("li");
  li.textContent=v;
  hist.appendChild(li);
 });
}
</script>
</body>
</html>
